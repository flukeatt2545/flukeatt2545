<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="FLUKE NKN — cloud, bots and servers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#120708"/>
      <stop offset="1" stop-color="#1f0508"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1a1a"/>
      <stop offset="1" stop-color="#c4001a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff1a1a" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 800 84px 'Segoe UI', Arial, sans-serif; letter-spacing: 12px; }
    .sub { font: 500 22px 'Consolas', 'Courier New', monospace; fill: #e8a0a0; letter-spacing: 2px; }
    .scan { animation: scan 5s linear infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(300px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <circle cx="880" cy="40" r="170" fill="#ff0000" opacity="0.12" class="pulse"/>
    <circle cx="90" cy="250" r="190" fill="#b00020" opacity="0.14" class="pulse"/>
    <rect class="scan" x="0" y="0" width="1000" height="3" fill="#ff1a1a" opacity="0.30"/>
    <g filter="url(#glow)">
      <text x="500" y="150" text-anchor="middle" class="title" fill="url(#neon)">FLUKE NKN</text>
    </g>
    <text x="500" y="205" text-anchor="middle" class="sub">cloud &#183; bots &#183; servers<tspan class="blink" fill="#ff1a1a"> _</tspan></text>
    <path d="M40 24h60M40 24v40" stroke="#ff1a1a" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M960 256h-60M960 256v-40" stroke="#ff3b3b" stroke-width="3" fill="none" opacity="0.8"/>
  </g>
  <rect x="1" y="1" width="998" height="278" rx="17" fill="none" stroke="url(#neon)" stroke-opacity="0.5" stroke-width="2"/>
</svg>
